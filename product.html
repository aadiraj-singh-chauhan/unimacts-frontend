      const psCounterBottom = document.getElementById('ps-counter-bottom');
      const psPrevTop = document.getElementById('ps-prev');
      const psNextTop = document.getElementById('ps-next');
      const psPrevBottom = document.getElementById('ps-prev-bottom');
      const psNextBottom = document.getElementById('ps-next-bottom');

      function render(idx) {
        productIdx = idx;
        const p = PRODUCTS[idx];
        document.title = `${p.code} – ${p.name.replace('\n', ' ')} | Unimacts`;
        if (psCategory) psCategory.textContent = p.category;
        const countStr = `${idx + 1} / ${PRODUCTS.length}`;
        if (psCounterTop) psCounterTop.textContent = countStr;
        if (psCounterBottom) psCounterBottom.textContent = countStr;
        psImage.src = p.img;
        psImage.alt = p.name.replace('\n', ' ');
        psCode.textContent = p.code;
        psName.innerHTML = p.name.replace('\n', '<br>');
        psDesc.textContent = p.desc;

        psSpecs.innerHTML = p.specs.map(([label, val]) =>
          `<tr><td class="ps-spec-label">${label}</td><td class="ps-spec-val">${val}</td></tr>`
        ).join('');

        psTags.innerHTML = p.tags.map(t => `<span class="ps-tag">${t}</span>`).join('');
        psLead.textContent = p.lead;

        const isFirst = idx === 0;
        const isLast = idx === PRODUCTS.length - 1;
        if (psPrevTop) psPrevTop.disabled = isFirst;
        if (psNextTop) psNextTop.disabled = isLast;
        if (psPrevBottom) psPrevBottom.disabled = isFirst;
        if (psNextBottom) psNextBottom.disabled = isLast;

        // Update URL search query without full reload
        const newUrl = `${window.location.pathname}?id=${idx}`;
        window.history.replaceState({ path: newUrl }, '', newUrl);
      }

      function navigate(newIdx) {
        if (newIdx >= 0 && newIdx < PRODUCTS.length) {
          render(newIdx);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      }

      if (psPrevTop) psPrevTop.addEventListener('click', () => navigate(productIdx - 1));
      if (psNextTop) psNextTop.addEventListener('click', () => navigate(productIdx + 1));
      if (psPrevBottom) psPrevBottom.addEventListener('click', () => navigate(productIdx - 1));
      if (psNextBottom) psNextBottom.addEventListener('click', () => navigate(productIdx + 1));

      document.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') navigate(productIdx + 1);
        if (e.key === 'ArrowLeft') navigate(productIdx - 1);
      });

      render(productIdx);
    })();
  </script>
</body>

</html>
